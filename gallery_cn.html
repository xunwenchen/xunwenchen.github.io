    <div id="lightbox" class="lightbox" aria-hidden="true">
        <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="图片查看器">
            <button type="button" class="lightbox-close" aria-label="关闭图片查看器">&times;</button>
            <button type="button" class="lightbox-nav prev" id="lightbox-prev" aria-label="查看上一张">&#8249;</button>
            <button type="button" class="lightbox-nav next" id="lightbox-next" aria-label="查看下一张">&#8250;</button>
            <div class="lightbox-stage">
                <img id="lightbox-image" src="" alt="">
            </div>
            <div id="lightbox-caption" class="lightbox-caption"></div>
            <div id="lightbox-thumbnails" class="lightbox-thumbnails"></div>
        </div>
    </div>

    <footer>
        <p>© 2026 xwchen</p>
    </footer>

    <script>
    (function () {
        var lightbox = document.getElementById('lightbox');
        var lightboxImage = document.getElementById('lightbox-image');
        var closeButton = lightbox.querySelector('.lightbox-close');
        var prevButton = document.getElementById('lightbox-prev');
        var nextButton = document.getElementById('lightbox-next');
        var captionBox = document.getElementById('lightbox-caption');
        var thumbnailBox = document.getElementById('lightbox-thumbnails');
        var memberItems = Array.from(document.querySelectorAll('#gallery .member-item'));
        var items = memberItems.map(function (memberItem) {
            var img = memberItem.querySelector('img');
            return {
                src: img.getAttribute('src'),
                alt: img.getAttribute('alt') || 'Gallery photo',
                caption: img.getAttribute('data-caption') || memberItem.querySelector('p').textContent.trim()
            };
        });
        var currentIndex = 0;
        var zoomed = false;

        function buildThumbnails() {
            thumbnailBox.innerHTML = '';
            items.forEach(function (item, index) {
                var thumbButton = document.createElement('button');
                thumbButton.type = 'button';
                thumbButton.className = 'lightbox-thumbnail' + (index === currentIndex ? ' active' : '');
                thumbButton.setAttribute('aria-label', '查看 ' + item.alt);
                var thumbImage = document.createElement('img');
                thumbImage.src = item.src;
                thumbImage.alt = item.alt;
                thumbButton.appendChild(thumbImage);
                thumbButton.addEventListener('click', function () {
                    currentIndex = index;
                    updateViewer();
                });
                thumbnailBox.appendChild(thumbButton);
            });
        }

        function updateViewer() {
            var item = items[currentIndex];
            lightboxImage.src = item.src;
            lightboxImage.alt = item.alt;
            captionBox.textContent = item.caption;
            zoomed = false;
            lightboxImage.classList.remove('zoomed');
            buildThumbnails();
        }

        function openLightbox(index) {
            currentIndex = index;
            updateViewer();
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
            lightboxImage.src = '';
            captionBox.textContent = '';
            document.body.style.overflow = '';
            zoomed = false;
            lightboxImage.classList.remove('zoomed');
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + items.length) % items.length;
            updateViewer();
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % items.length;
            updateViewer();
        }

        memberItems.forEach(function (memberItem, index) {
            memberItem.querySelector('img').addEventListener('click', function () {
                openLightbox(index);
            });
        });

        lightboxImage.addEventListener('click', function () {
            zoomed = !zoomed;
            lightboxImage.classList.toggle('zoomed', zoomed);
        });

        prevButton.addEventListener('click', showPrev);
        nextButton.addEventListener('click', showNext);
        closeButton.addEventListener('click', closeLightbox);

        lightbox.addEventListener('click', function (event) {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', function (event) {
            if (!lightbox.classList.contains('open')) {
                return;
            }
            if (event.key === 'Escape') {
                closeLightbox();
            } else if (event.key === 'ArrowLeft') {
                showPrev();
            } else if (event.key === 'ArrowRight') {
                showNext();
            }
        });
    })();
    </script>
